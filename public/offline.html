<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Riggly · Offline</title>
  <!--
    Shown by the service worker (public/sw.js) for a page that hasn't been saved on this device yet,
    when there's no internet. It lists every page that is saved, read straight from the worker's cache.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0b0b; color: #f2f2f2; min-height: 100vh; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 2rem 1rem 3rem; }
    .brand { display: flex; align-items: center; gap: .6rem; margin-bottom: 2rem; }
    .brand img { width: 2.25rem; height: 2.25rem; border-radius: .6rem; }
    .brand b { font-size: 1.15rem; }
    .pill { display: inline-flex; align-items: center; gap: .4rem; border: 1px solid #264232; background: #0f1813; color: #7dd3a0; border-radius: 999px; padding: .25rem .7rem; font-size: .75rem; font-weight: 700; }
    h1 { font-size: 1.5rem; margin: .9rem 0 .4rem; }
    p.lead { color: #a3a3a3; font-size: .95rem; line-height: 1.5; }
    .actions { display: flex; gap: .5rem; margin: 1.25rem 0 2rem; flex-wrap: wrap; }
    button { font: inherit; font-size: .875rem; font-weight: 700; border-radius: .75rem; padding: .6rem 1rem; cursor: pointer; border: 1px solid #264232; background: transparent; color: #f2f2f2; }
    button.primary { background: #7dd3a0; color: #0b0b0b; border-color: #7dd3a0; }
    h2 { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: #737373; margin: 1.5rem 0 .6rem; }
    a.card { display: flex; justify-content: space-between; align-items: center; gap: .75rem; background: #121212; border: 1px solid #1f1f1f; border-radius: .9rem; padding: .8rem 1rem; margin-bottom: .5rem; color: inherit; text-decoration: none; }
    a.card:active, a.card:hover { border-color: #264232; }
    .card span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card small { color: #737373; font-size: .75rem; white-space: nowrap; }
    .empty { color: #737373; font-size: .9rem; border: 1px dashed #262626; border-radius: .9rem; padding: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="/icon-192.png" alt="" /><b>Riggly</b></div>
    <span class="pill">● Offline</span>
    <h1>This page isn’t saved on this phone yet</h1>
    <p class="lead">There’s no internet right now. Everything below was saved the last time you were online, so you can still open it.</p>
    <div class="actions">
      <button class="primary" onclick="location.reload()">Try again</button>
      <button onclick="history.back()">Go back</button>
    </div>
    <div id="lists"><p class="empty">Looking for saved pages…</p></div>
  </div>

<script>
  var SECTIONS = { '': 'Today', shows: 'Shows', setlists: 'Setlists', songs: 'Songs', recordings: 'Recordings', finance: 'Finance', merch: 'Merch', calendar: 'Calendar', tasks: 'Tasks', notes: 'Notes', 'event-management': 'Agencies', more: 'More', notifications: 'Notifications', settings: 'Settings' }
  var GROUPS = [['setlists', 'Setlists'], ['songs', 'Songs'], ['shows', 'Shows'], ['tasks', 'Task boards']]

  function ago(ms) {
    var mins = Math.round((Date.now() - ms) / 60000)
    if (mins < 1) return 'just now'
    if (mins < 60) return mins + ' min ago'
    var h = Math.round(mins / 60)
    if (h < 24) return h + ' h ago'
    var d = Math.round(h / 24)
    return d === 1 ? '1 day ago' : d + ' days ago'
  }
  // Text only: the saved page's heading is read as plain text, never run as HTML.
  function text(html) { return new DOMParser().parseFromString(html, 'text/html').body.textContent.trim() }
  function card(href, label, note) {
    var a = document.createElement('a')
    a.className = 'card'; a.href = href
    var s = document.createElement('span'); s.textContent = label
    var m = document.createElement('small'); m.textContent = note || ''
    a.appendChild(s); a.appendChild(m)
    return a
  }
  function heading(t) { var h = document.createElement('h2'); h.textContent = t; return h }

  async function load() {
    var box = document.getElementById('lists')
    var pages = []
    try {
      var cache = await caches.open('riggly-pages-v1')
      var reqs = await cache.keys()
      for (var i = 0; i < reqs.length; i++) {
        var url = new URL(reqs[i].url)
        if (url.origin !== location.origin) continue
        var res = await cache.match(reqs[i])
        var html = await res.text()
        // A page's own heading names it best (a setlist's title, a song's name...).
        var h1 = html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i)
        pages.push({ path: url.pathname + url.search, parts: url.pathname.split('/').filter(Boolean), title: h1 ? text(h1[1]).slice(0, 80) : '', savedAt: Number(res.headers.get('x-riggly-saved-at') || 0) })
      }
    } catch (e) { /* no cache access */ }

    // Setlists kept with the "Save offline" button.
    try {
      JSON.parse(localStorage.getItem('tarana-offline-setlists') || '[]').forEach(function (s) {
        var path = '/setlists/' + s.id
        if (!pages.some(function (p) { return p.path === path })) pages.push({ path: path, parts: ['setlists', s.id], title: s.title, savedAt: Date.parse(s.savedAt) || 0 })
      })
    } catch (e) { /* ignore */ }

    box.innerHTML = ''
    if (!pages.length) {
      box.innerHTML = '<p class="empty">Nothing is saved on this phone yet. Open Riggly once while you’re online and your pages are saved for next time.</p>'
      return
    }
    var order = Object.keys(SECTIONS)
    var main = pages.filter(function (p) { return p.parts.length <= 1 && (p.parts[0] || '') in SECTIONS })
      .sort(function (a, b) { return order.indexOf(a.parts[0] || '') - order.indexOf(b.parts[0] || '') })
    if (main.length) {
      box.appendChild(heading('Sections'))
      main.forEach(function (p) { box.appendChild(card(p.path, SECTIONS[p.parts[0] || ''], p.savedAt ? ago(p.savedAt) : '')) })
    }
    GROUPS.forEach(function (g) {
      var items = pages.filter(function (p) { return p.parts[0] === g[0] && p.parts.length === 2 })
      if (!items.length) return
      box.appendChild(heading(g[1]))
      items.sort(function (a, b) { return (a.title || '').localeCompare(b.title || '') })
        .forEach(function (p) { box.appendChild(card(p.path, p.title || g[1].replace(/s$/, ''), p.savedAt ? ago(p.savedAt) : '')) })
    })
    if (!box.children.length) {
      box.innerHTML = '<p class="empty">Nothing is saved on this phone yet. Open Riggly once while you’re online and your pages are saved for next time.</p>'
    }
  }
  load()
</script>
</body>
</html>
